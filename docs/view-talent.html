<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gala</title>
    <meta property="og:title" content="Gala">
    <meta property="og:description" content="Book event professionals near you.">
    <meta property="og:image" content="https://gala.app/assets/apple-touch-icon.png">
    <meta property="og:image:width" content="180">
    <meta property="og:image:height" content="180">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://gala.app/assets/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .download-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 48px 32px;
            max-width: 360px;
            width: 100%;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin-bottom: 28px;
        }

        .headline {
            font-family: "Inter", sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .subtext {
            font-family: "Inter", sans-serif;
            font-size: 15px;
            color: #A28B81;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .app-store-btn {
            display: inline-block;
            background: #fff;
            color: #000;
            font-family: "Inter", sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            width: 100%;
            max-width: 260px;
            transition: opacity 0.2s;
        }

        .app-store-btn:hover {
            opacity: 0.85;
            text-decoration: none;
        }

        .footer-link {
            margin-top: 24px;
            font-family: "Inter", sans-serif;
            font-size: 13px;
            color: #555;
            display: block;
        }

        .footer-link a {
            color: #555;
            text-decoration: underline;
            display: inline;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="download-card">
        <img src="/assets/apple-touch-icon.png" alt="Gala" class="logo">
        <p class="headline">Open this profile in Gala</p>
        <p class="subtext">Download the app to browse and book event professionals near you.</p>
        <a href="https://apps.apple.com/app/id YOUR_APP_ID" class="app-store-btn">Download on the App Store</a>
    </div>
</body>
</html>
