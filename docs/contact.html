<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Contact — Gala</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-v2.png">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/legal.css">
</head>
<body class="legal-new">
    <nav id="top-nav">
        <a href="/"><img src="/assets/images/gala-wordmark-black.svg" alt="Gala" id="nav-logo"></a>
    </nav>
    <main class="legal-content">
        <h1 class="title-nunito">Contact</h1>
        <p>Have a question or need help? Tell us what's going on and we'll get back to you as soon as possible.</p>

        <!-- Pressing Send opens the visitor's own email app with the message filled in,
             addressed to support@galatheapp.com (see the script below). Nothing is
             collected or stored by this website. -->
        <form class="contact-form" id="contact-form" action="mailto:support@galatheapp.com" method="post" enctype="text/plain">
            <div class="field">
                <label for="cf-name">Name</label>
                <input type="text" id="cf-name" name="Name" autocomplete="name" required maxlength="100">
            </div>

            <div class="field">
                <label for="cf-email">Contact email</label>
                <input type="email" id="cf-email" name="Contact email" autocomplete="email" required maxlength="200">
            </div>

            <div class="field">
                <label for="cf-topic">What's your concern about?</label>
                <select id="cf-topic" name="Topic" required>
                    <option value="" disabled selected>Choose one</option>
                    <option>Booking</option>
                    <option>Payment</option>
                    <option>My account or login</option>
                    <option>My talent profile</option>
                    <option>Something else</option>
                </select>
            </div>

            <div class="field">
                <label for="cf-issue">Describe the issue</label>
                <textarea id="cf-issue" name="Issue" rows="6" required maxlength="500" aria-describedby="cf-count"></textarea>
                <div class="char-count" id="cf-count" aria-live="polite">0 / 500</div>
            </div>

            <button type="submit" class="send-btn">Send</button>
            <p class="form-note" id="cf-note">Pressing Send opens your email app with your message ready to send to support@galatheapp.com.</p>
        </form>
    </main>
    <footer id="legal-footer">
        <span>&copy; 2026 Gala</span>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
        <a href="/support.html">Support</a>
    </footer>
    <script>
    (function () {
      var form = document.getElementById('contact-form');
      var issue = document.getElementById('cf-issue');
      var count = document.getElementById('cf-count');
      var note = document.getElementById('cf-note');

      function updateCount() { count.textContent = issue.value.length + ' / 500'; }
      issue.addEventListener('input', updateCount);
      updateCount();

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('cf-name').value.trim();
        var email = document.getElementById('cf-email').value.trim();
        var topic = document.getElementById('cf-topic').value;
        var text = issue.value.trim().slice(0, 500);

        var subject = 'Gala inquiry: ' + topic;
        var body = 'Name: ' + name + '\r\n' +
                   'Contact email: ' + email + '\r\n' +
                   'Topic: ' + topic + '\r\n\r\n' +
                   'Issue:\r\n' + text;
        window.location.href = 'mailto:support@galatheapp.com?subject=' +
          encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

        note.textContent = 'If your email app did not open, you can email us directly at support@galatheapp.com.';
      });
    })();
    </script>
</body>
</html>
