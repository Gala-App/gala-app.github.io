<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gala</title>
    <meta property="og:title" content="Gala | Entertainment">
    <meta property="og:description" content="Plan Less. Experience More.">
    <meta property="og:image" content="https://galatheapp.com/assets/images/og-share-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <meta property="og:url" content="https://galatheapp.com">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Gala | Entertainment">
    <meta name="twitter:image" content="https://galatheapp.com/assets/images/og-share-card.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,400;0,700;0,900;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <!-- Hero: full-bleed tone setter, not a card -->
    <section class="hero">
        <!-- Small black badge logo, top-left corner -->
        <img src="/assets/images/gala-badge-black.png" alt="Gala" class="corner-logo">
        <!-- Top buttons. Destinations not decided yet, so they go nowhere for now. -->
        <nav class="top-nav" aria-label="Main">
            <a class="top-nav-btn" href="#">Contact</a>
            <a class="top-nav-btn" href="#">About</a>
        </nav>
        <div class="hero-brand">
            <img src="/assets/images/gala-wordmark-black.svg" alt="Gala" class="wordmark-img">
        </div>
    </section>

    <!-- Colorful tiles under the hero (new brand, draft). The wavy shape is from
         marketing's SVG; it clips the cream badge so a photo can show inside it
         when the mouse is over it. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <clipPath id="wiggle-blob" clipPathUnits="objectBoundingBox">
                <path transform="scale(0.0037037)" d="M200.59 33.48C208.07 40.5025 206.987 50.535 213.74 57.9425C217.725 62.825 224.452 65.6975 230.002 68.935C234.182 71.415 237.6 74.8325 240.175 79.3425C245.407 88.61 248.49 99.7625 248.83 109.832C249.21 119.497 243.525 127.965 245.067 137.515C246.225 145.042 250.08 152.05 249.997 159.765C249.395 174.95 242.79 191.367 228.182 199.845L227.958 199.98C210.937 208.91 212.177 217.062 203.01 229.717C194.42 240.585 176.283 251.357 162.66 249.857C152.883 248.697 145.117 241.952 134.75 242.527C123.272 242.617 113.862 250.36 102.13 248.385C88.8725 246.692 72.6525 239.165 65.67 228.93C61.2225 222.492 60.3875 214.67 54.5825 208.81C48.435 202.217 38.19 199.395 32.305 192.647C24.1225 183.397 18.9525 167.913 20.175 156.073C21.0225 148.617 25.385 141.807 25.305 134.215C25.38 127.087 22.0125 120.205 20.9475 113.152C18.6425 99.2325 24.765 83.1025 35.03 73.8325C50.785 61.6575 55.57 64.0825 60.97 44.5325C65.8175 29.915 85.255 18.78 104.057 20.2775C116.117 21.195 126.932 26.925 139.317 25.2775C147.105 24.6125 153.495 21.4025 161.07 20.3475C175.455 18.3925 191.873 24.9125 200.585 33.48L200.59 33.48Z"/>
            </clipPath>
        </defs>
    </svg>

    <!-- Photo under the tiles with the tagline on top. Drag the slider left and
         right: left of the line is black and white, right of it is full color. -->
    <section class="compare" id="compare" aria-label="Photo slider from black and white to color">
        <img class="compare-img" src="/assets/images/hero-martinis.jpg" alt="Two martinis clinking at a candlelit table" loading="lazy">
        <div class="compare-bw">
            <img class="compare-img compare-img--bw" src="/assets/images/hero-martinis.jpg" alt="" loading="lazy">
        </div>
        <p class="compare-statement">Plan Less. Experience More.</p>
        <div class="compare-handle" role="slider" tabindex="0" aria-label="Black and white to color"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="compare-line"></span>
            <span class="compare-grip" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6"/><path d="M15 6l6 6-6 6"/></svg>
            </span>
        </div>
    </section>

    <section class="tiles" aria-label="What you can book">
        <div class="tile tile--navy">
            <div class="tile-blob">
                <img class="tile-photo" src="/assets/images/category-bartenders.jpg" alt="Bartender pouring craft cocktails" loading="lazy">
                <span class="tile-label tile-label--orange">Bartenders</span>
            </div>
        </div>
        <div class="tile tile--yellow">
            <div class="tile-blob">
                <img class="tile-photo" src="/assets/images/category-food-vendors.jpg" alt="Catering: tacos with a lime garnish" loading="lazy">
                <span class="tile-label tile-label--green">Catering</span>
            </div>
        </div>
        <div class="tile tile--green">
            <div class="tile-blob">
                <img class="tile-photo" src="/assets/images/category-music-artists.jpg" alt="DJ performing behind a record wall" loading="lazy">
                <span class="tile-label tile-label--navy">Music Artists</span>
            </div>
        </div>
        <div class="tile tile--orange">
            <div class="tile-blob">
                <img class="tile-photo" src="/assets/images/category-entertainment.jpg" alt="Fire performer dancing on the beach at night" loading="lazy">
                <span class="tile-label tile-label--navy">Entertainment</span>
            </div>
        </div>
    </section>

    <div class="container">

        <!-- Footer -->
        <footer class="c4" id="last-section">
            <nav id="bottom-navbar">
                <div id="bottom-nav-left">
                    <span>&copy; 2026 Gala</span>
                    <a href="/privacy.html">Privacy</a>
                    <a href="/terms.html">Terms</a>
                    <a href="/support.html">Support</a>
                </div>
            </nav>
        </footer>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
